<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumbnail Design Portfolio | Elevate Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F9F7F2] text-[#1A1A1A] font-sans selection:bg-black selection:text-white">

    <nav class="p-8 md:p-12 max-w-7xl mx-auto flex justify-between items-center">
        <a href="index.html" class="text-[10px] uppercase tracking-[0.3em] border-b border-black pb-1 hover:opacity-50 transition">← Back to Home</a>
        <span class="text-[10px] uppercase tracking-[0.3em] opacity-40">Portfolio / Graphics</span>
    </nav>

    <header class="max-w-7xl mx-auto px-8 mb-20" data-aos="fade-up">
        <h1 class="text-6xl md:text-8xl font-serif italic mb-6">Thumbnail Design</h1>
        <p class="max-w-xl text-gray-500 leading-relaxed uppercase text-[11px] tracking-[0.2em]">
            High CTR (Click-Through Rate) graphics designed to stop the scroll and dominate the feed.
        </p>
    </header>

    <main class="max-w-7xl mx-auto px-8 pb-32">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <div class="group relative overflow-hidden bg-gray-200 aspect-video shadow-sm" data-aos="fade-up">
                <img src="thumb1.jpg" alt="Design Sample 1" class="w-full h-full object-cover transition duration-700 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition duration-500 flex items-center justify-center">
                    <p class="text-white text-[10px] uppercase tracking-[0.4em]">View Concept</p>
                </div>
            </div>

            <div class="group relative overflow-hidden bg-gray-200 aspect-video shadow-sm" data-aos="fade-up" data-aos-delay="100">
                <img src="thumb2.jpg" alt="Design Sample 2" class="w-full h-full object-cover transition duration-700 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition duration-500 flex items-center justify-center">
                    <p class="text-white text-[10px] uppercase tracking-[0.4em]">View Concept</p>
                </div>
            </div>

            <div class="group relative overflow-hidden bg-gray-200 aspect-video shadow-sm" data-aos="fade-up" data-aos-delay="200">
                <img src="thumb3.jpg" alt="Design Sample 3" class="w-full h-full object-cover transition duration-700 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition duration-500 flex items-center justify-center">
                    <p class="text-white text-[10px] uppercase tracking-[0.4em]">View Concept</p>
                </div>
            </div>

            </div>
    </main>

    <footer class="py-20 border-t border-gray-200 text-center">
        <p class="text-[10px] uppercase tracking-[0.4em] opacity-40">Elevate Media Web &copy; 2026</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
    </script>
</body>
</html>
